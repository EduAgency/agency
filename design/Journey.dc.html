<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; background: #e9f6f4; font-family: "Montserrat", system-ui, sans-serif; }
    a { color: #1553a8; } a:hover { color: #0e3f80; }

    /* One 11s cycle: draw for ~3.4s, hold, then a soft reset.
       Every element is keyed to the same timeline, so a stage lights up
       exactly as the line reaches it rather than on its own schedule. */
    .stage, .cap, .title { opacity: 0; }

    .title { animation: title 11s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes title {
      0%   { opacity: 0; transform: translateY(14px); }
      5%,94% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }

    /* The line draws itself. 3720 is just over the measured path length. */
    .track {
      stroke-dasharray: 3720;
      stroke-dashoffset: 3720;
      animation: draw 11s cubic-bezier(.65,.02,.28,1) infinite;
    }
    @keyframes draw {
      0%      { stroke-dashoffset: 3720; opacity: 1; }
      31%,94% { stroke-dashoffset: 0; opacity: 1; }
      100%    { stroke-dashoffset: 0; opacity: 0; }
    }

    /* A short bright dash running just ahead of the draw - the thing that
       makes it read as travel rather than as a line appearing. */
    .comet {
      stroke-dasharray: 8 3712;
      stroke-dashoffset: 3720;
      animation: comet 11s cubic-bezier(.65,.02,.28,1) infinite;
    }
    @keyframes comet {
      0%   { stroke-dashoffset: 3720; opacity: 0; }
      3%   { opacity: 1; }
      29%  { opacity: 1; }
      31%  { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .cap-start { animation: cap 11s ease-out infinite; }
    .cap-end   { animation: capEnd 11s ease-out infinite; }
    @keyframes cap {
      0% { opacity: 0; transform: translateX(-10px); }
      4%,94% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; }
    }
    @keyframes capEnd {
      0%,31% { opacity: 0; transform: translateX(-10px); }
      36%,94% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; }
    }

    /* Stage reveal. transform-box keeps SVG transforms about the group's own
       box rather than the viewBox origin. */
    .stage { transform-box: fill-box; transform-origin: center; }
    .s1 { animation: stage 11s cubic-bezier(.34,1.4,.44,1) infinite;  animation-delay: .88s; }
    .s2 { animation: stage 11s cubic-bezier(.34,1.4,.44,1) infinite;  animation-delay: 1.54s; }
    .s3 { animation: stage 11s cubic-bezier(.34,1.4,.44,1) infinite;  animation-delay: 2.20s; }
    .s4 { animation: stage 11s cubic-bezier(.34,1.4,.44,1) infinite;  animation-delay: 2.81s; }
    .s5 { animation: stage 11s cubic-bezier(.34,1.4,.44,1) infinite;  animation-delay: 3.41s; }
    @keyframes stage {
      0%     { opacity: 0; transform: translateY(18px) scale(.9); }
      6%,85% { opacity: 1; transform: translateY(0) scale(1); }
      94%    { opacity: 1; }
      100%   { opacity: 0; transform: translateY(0) scale(1); }
    }

    /* Numbers resolve out of a blur. Cheap, and it reads as "focusing". */
    .num { animation: num 11s cubic-bezier(.22,1,.36,1) infinite; }
    .s1 .num { animation-delay: .88s; } .s2 .num { animation-delay: 1.54s; }
    .s3 .num { animation-delay: 2.20s; } .s4 .num { animation-delay: 2.81s; }
    .s5 .num { animation-delay: 3.41s; }
    @keyframes num {
      0%   { filter: blur(7px); opacity: 0; }
      7%   { filter: blur(0);   opacity: 1; }
      100% { filter: blur(0);   opacity: 1; }
    }

    /* At rest the icons breathe, so the finished frame is not dead. */
    .icon { transform-box: fill-box; transform-origin: center; animation: float 6.5s ease-in-out infinite; }
    .f2 { animation-delay: -1.1s; } .f3 { animation-delay: -2.4s; }
    .f4 { animation-delay: -3.3s; } .f5 { animation-delay: -4.6s; }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-7px); }
    }

    /* The label band wipes in behind the text. */
    .band { transform-box: fill-box; transform-origin: left center; animation: band 11s cubic-bezier(.22,1,.36,1) infinite; }
    .s1 .band { animation-delay: .88s; } .s2 .band { animation-delay: 1.54s; }
    .s3 .band { animation-delay: 2.20s; } .s4 .band { animation-delay: 2.81s; }
    .s5 .band { animation-delay: 3.41s; }
    @keyframes band {
      0% { transform: scaleX(0); }
      8%,100% { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage, .cap, .title, .track, .comet, .icon, .band, .num {
        animation: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        filter: none !important;
        transform: none !important;
      }
      .comet { opacity: 0 !important; }
    }
  </style>
</helmet>

<svg viewBox="0 0 1656 930" width="1656" height="930" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The student recruitment journey: engagement, application, decision, planning, arrival.">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0f4c9b"/>
      <stop offset=".42"  stop-color="#175fae"/>
      <stop offset=".72"  stop-color="#2a8cb8"/>
      <stop offset="1"    stop-color="#37acb6"/>
    </linearGradient>
    <linearGradient id="bandFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".2"  stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".8"  stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1656" height="930" fill="#e9f6f4"/>

  <text class="title" x="828" y="106" text-anchor="middle" font-size="47" font-weight="800" fill="#1553a8" letter-spacing="-.5">The Student Recruitment Journey</text>

  <!-- The serpentine. Verticals 260px apart, joined by true semicircles, so
       every loop is a stadium exactly like the reference. -->
  <path class="track"
        d="M 95 490 H 130 A 55 55 0 0 1 185 545 V 640 A 127.5 127.5 0 0 0 440 640 V 335 A 130 130 0 0 1 700 335 V 640 A 130 130 0 0 0 960 640 V 335 A 132.5 132.5 0 0 1 1225 335 V 640 A 132.5 132.5 0 0 0 1490 640 V 545 A 55 55 0 0 1 1545 490 H 1580"
        fill="none" stroke="url(#flow)" stroke-width="11" stroke-linecap="round"/>
  <path class="comet"
        d="M 95 490 H 130 A 55 55 0 0 1 185 545 V 640 A 127.5 127.5 0 0 0 440 640 V 335 A 130 130 0 0 1 700 335 V 640 A 130 130 0 0 0 960 640 V 335 A 132.5 132.5 0 0 1 1225 335 V 640 A 132.5 132.5 0 0 0 1490 640 V 545 A 55 55 0 0 1 1545 490 H 1580"
        fill="none" stroke="#8fe9ec" stroke-width="13" stroke-linecap="round"/>

  <!-- End caps -->
  <g class="cap cap-start">
    <path d="M 62 466 L 88 490 L 62 514" fill="none" stroke="#0f4c9b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="cap cap-end">
    <path d="M 1588 466 L 1614 490 L 1588 514" fill="none" stroke="#37acb6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============================ 01 Engagement ============================ -->
  <g class="stage s1">
    <text class="num" x="310" y="478" text-anchor="middle" font-size="58" font-weight="700" fill="#175fae">01</text>
    <rect class="band" x="180" y="518" width="260" height="44" fill="url(#bandFade)"/>
    <text x="310" y="548" text-anchor="middle" font-size="20" font-weight="700" fill="#1553a8">Engagement</text>
    <g class="icon f1">
      <circle cx="318" cy="672" r="62" fill="#d7ebf7"/>
      <!-- two profile records -->
      <rect x="252" y="626" width="104" height="40" rx="5" fill="#fff" stroke="#1f5fa8" stroke-width="2.5"/>
      <circle cx="270" cy="646" r="9" fill="#31c4a4"/>
      <rect x="286" y="638" width="56" height="5.5" rx="2.75" fill="#9fc4e4"/>
      <rect x="286" y="649" width="40" height="5.5" rx="2.75" fill="#cfe2f2"/>
      <rect x="252" y="674" width="104" height="40" rx="5" fill="#fff" stroke="#1f5fa8" stroke-width="2.5"/>
      <circle cx="270" cy="694" r="9" fill="#31c4a4"/>
      <rect x="286" y="686" width="56" height="5.5" rx="2.75" fill="#9fc4e4"/>
      <rect x="286" y="697" width="40" height="5.5" rx="2.75" fill="#cfe2f2"/>
      <!-- magnifier -->
      <circle cx="333" cy="659" r="30" fill="#eaf4fb" fill-opacity=".85" stroke="#1f5fa8" stroke-width="6"/>
      <path d="M 352 682 L 374 706" stroke="#1f5fa8" stroke-width="11" stroke-linecap="round"/>
      <path d="M 356 686 L 378 710" stroke="#f4b93e" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============================ 02 Application =========================== -->
  <g class="stage s2">
    <text class="num" x="575" y="322" text-anchor="middle" font-size="58" font-weight="700" fill="#1a66b2">02</text>
    <rect class="band" x="445" y="352" width="260" height="44" fill="url(#bandFade)"/>
    <text x="575" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#1553a8">Application</text>
    <g class="icon f2">
      <circle cx="584" cy="510" r="62" fill="#d7ebf7"/>
      <!-- clipboard -->
      <rect x="527" y="452" width="98" height="122" rx="8" fill="#2fae9b"/>
      <rect x="537" y="464" width="78" height="100" rx="4" fill="#fff"/>
      <rect x="561" y="443" width="30" height="18" rx="5" fill="#1f8f7f"/>
      <circle cx="576" cy="443" r="6" fill="#1f8f7f"/>
      <rect x="548" y="480" width="56" height="7" rx="3.5" fill="#bfe0f2"/>
      <rect x="548" y="495" width="40" height="7" rx="3.5" fill="#e2eef7"/>
      <rect x="548" y="510" width="50" height="7" rx="3.5" fill="#e2eef7"/>
      <rect x="548" y="525" width="34" height="7" rx="3.5" fill="#e2eef7"/>
      <!-- pen -->
      <path d="M 520 542 L 592 476" stroke="#1b3f6b" stroke-width="8" stroke-linecap="round"/>
      <path d="M 588 480 L 600 468" stroke="#f4b93e" stroke-width="9" stroke-linecap="round"/>
      <!-- hand -->
      <path d="M 512 556 q 14 -22 34 -16 q 16 5 24 16 l 8 22 q -34 12 -60 4 z" fill="#c97a4a"/>
      <path d="M 512 556 q 14 -22 34 -16 l -6 14 q -16 -2 -28 2 z" fill="#b56a3e"/>
    </g>
  </g>

  <!-- ============================== 03 Decision ============================ -->
  <g class="stage s3">
    <text class="num" x="837" y="478" text-anchor="middle" font-size="58" font-weight="700" fill="#175fae">03</text>
    <rect class="band" x="707" y="518" width="260" height="44" fill="url(#bandFade)"/>
    <text x="837" y="548" text-anchor="middle" font-size="20" font-weight="700" fill="#1553a8">Decision</text>
    <g class="icon f3">
      <circle cx="845" cy="672" r="62" fill="#d7ebf7"/>
      <!-- passport -->
      <rect x="762" y="622" width="72" height="98" rx="7" fill="#1f5fa8"/>
      <rect x="770" y="630" width="56" height="82" rx="4" fill="#2a72c0"/>
      <circle cx="798" cy="662" r="17" fill="none" stroke="#bfe0f2" stroke-width="2.5"/>
      <path d="M 781 662 h 34 M 798 645 q 9 17 0 34 M 798 645 q -9 17 0 34" stroke="#bfe0f2" stroke-width="2.5" fill="none"/>
      <rect x="784" y="690" width="28" height="5" rx="2.5" fill="#bfe0f2"/>
      <!-- visa document -->
      <path d="M 822 616 h 62 l 22 22 v 84 a 6 6 0 0 1 -6 6 h -78 a 6 6 0 0 1 -6 -6 v -100 a 6 6 0 0 1 6 -6 z" fill="#fff" stroke="#dbe8f2" stroke-width="2"/>
      <path d="M 884 616 v 22 h 22 z" fill="#f4d9c4"/>
      <rect x="834" y="640" width="26" height="18" rx="3" fill="#f2b9c4"/>
      <text x="872" y="654" text-anchor="middle" font-size="15" font-weight="800" fill="#e0607a">VISA</text>
      <rect x="834" y="668" width="60" height="6" rx="3" fill="#dbe8f2"/>
      <rect x="834" y="682" width="46" height="6" rx="3" fill="#eaf1f7"/>
      <rect x="834" y="696" width="54" height="6" rx="3" fill="#eaf1f7"/>
      <!-- approved -->
      <circle cx="886" cy="710" r="23" fill="#2fbf9b"/>
      <path d="M 875 710 l 7 8 l 14 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ============================== 04 Planning =========================== -->
  <g class="stage s4">
    <text class="num" x="1100" y="322" text-anchor="middle" font-size="58" font-weight="700" fill="#2a8cb8">04</text>
    <rect class="band" x="970" y="352" width="260" height="44" fill="url(#bandFade)"/>
    <text x="1100" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#1a6fa8">Planning</text>
    <g class="icon f4">
      <circle cx="1094" cy="510" r="62" fill="#d7ebf7"/>
      <!-- tan bag behind -->
      <rect x="1112" y="492" width="58" height="72" rx="9" fill="#f4c268"/>
      <rect x="1112" y="492" width="58" height="72" rx="9" fill="none" stroke="#e0a93f" stroke-width="2"/>
      <path d="M 1141 492 v 72" stroke="#e0a93f" stroke-width="3"/>
      <path d="M 1126 492 v -12 a 15 15 0 0 1 30 0 v 12" fill="none" stroke="#e0a93f" stroke-width="5"/>
      <!-- main suitcase -->
      <path d="M 1052 452 v -14 h 30 v 14" fill="none" stroke="#7f8b93" stroke-width="6" stroke-linecap="round"/>
      <rect x="1032" y="452" width="70" height="112" rx="13" fill="#2fae9b"/>
      <rect x="1032" y="452" width="70" height="112" rx="13" fill="none" stroke="#1f8f7f" stroke-width="2.5"/>
      <path d="M 1056 452 v 112 M 1078 452 v 112" stroke="#1f8f7f" stroke-width="3" opacity=".55"/>
      <rect x="1040" y="470" width="22" height="16" rx="3" fill="#fff" opacity=".9"/>
      <circle cx="1075" cy="518" r="11" fill="#fff" opacity=".9"/>
      <circle cx="1075" cy="518" r="5" fill="#2fae9b"/>
      <rect x="1038" y="566" width="12" height="9" rx="3" fill="#7f8b93"/>
      <rect x="1084" y="566" width="12" height="9" rx="3" fill="#7f8b93"/>
    </g>
  </g>

  <!-- =============================== 05 Arrival =========================== -->
  <g class="stage s5">
    <text class="num" x="1365" y="478" text-anchor="middle" font-size="58" font-weight="700" fill="#37acb6">05</text>
    <rect class="band" x="1235" y="518" width="260" height="44" fill="url(#bandFade)"/>
    <text x="1365" y="548" text-anchor="middle" font-size="20" font-weight="700" fill="#2a93a8">Arrival</text>
    <g class="icon f5">
      <circle cx="1360" cy="672" r="62" fill="#d7ebf7"/>
      <!-- ticket behind, rotated -->
      <g transform="rotate(-9 1350 676)">
        <rect x="1300" y="628" width="108" height="72" rx="7" fill="#f4c268"/>
        <rect x="1300" y="628" width="108" height="72" rx="7" fill="none" stroke="#e0a93f" stroke-width="2"/>
      </g>
      <!-- boarding pass front -->
      <g transform="rotate(6 1356 680)">
        <rect x="1306" y="640" width="112" height="76" rx="7" fill="#fff" stroke="#dbe8f2" stroke-width="2"/>
        <rect x="1314" y="650" width="30" height="24" rx="4" fill="#cfe2f2"/>
        <circle cx="1329" cy="659" r="6" fill="#7fb0da"/>
        <path d="M 1322 671 q 7 -7 14 0 z" fill="#7fb0da"/>
        <rect x="1352" y="650" width="56" height="6" rx="3" fill="#dbe8f2"/>
        <rect x="1352" y="662" width="40" height="6" rx="3" fill="#eaf1f7"/>
        <path d="M 1306 682 h 112" stroke="#dbe8f2" stroke-width="2" stroke-dasharray="5 4"/>
        <rect x="1314" y="692" width="34" height="16" rx="3" fill="#f2b9c4"/>
        <rect x="1356" y="694" width="52" height="6" rx="3" fill="#eaf1f7"/>
      </g>
      <!-- approval stamp -->
      <g transform="rotate(-14 1404 660)">
        <rect x="1386" y="640" width="40" height="26" rx="5" fill="#e0607a"/>
        <rect x="1398" y="666" width="16" height="20" rx="4" fill="#c94c66"/>
        <rect x="1390" y="686" width="32" height="9" rx="4" fill="#e0607a"/>
      </g>
    </g>
  </g>
</svg>
</x-dc>
